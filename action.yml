name: 'Paradigm Blast Radius'
description: 'AI-powered blast radius analysis for pull requests using Paradigm code intelligence'
branding:
  icon: 'target'
  color: 'orange'

inputs:
  github-token:
    description: 'GitHub Personal Access Token linked to your Paradigm account'
    required: true
  project:
    description: 'Paradigm project name'
    required: true
  api-url:
    description: 'Paradigm API URL'
    required: false
    default: 'https://api.useparadigm.app'

outputs:
  verdict:
    description: 'Analysis verdict: PASS, WARNING, or FAIL'
    value: ${{ steps.analyze.outputs.verdict }}
  affected:
    description: 'Number of affected methods in blast radius'
    value: ${{ steps.analyze.outputs.affected }}

runs:
  using: 'composite'
  steps:
    - name: Analyze blast radius
      id: analyze
      shell: bash
      env:
        PARADIGM_TOKEN: ${{ inputs.github-token }}
        PARADIGM_PROJECT: ${{ inputs.project }}
        PARADIGM_API_URL: ${{ inputs.api-url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # Call Paradigm API (LLM analysis happens server-side)
        HTTP_CODE=$(curl -s -o /tmp/paradigm_response.json -w "%{http_code}" \
          -X POST "${PARADIGM_API_URL}/api/hook/blast-radius" \
          -H "Authorization: Bearer ${PARADIGM_TOKEN}" \
          -H "Content-Type: application/json" \
          -H "ngrok-skip-browser-warning: true" \
          -d "{\"project\": \"${PARADIGM_PROJECT}\", \"repo\": \"${REPO}\", \"pr_number\": ${PR_NUMBER}}")

        RESPONSE=$(cat /tmp/paradigm_response.json)

        if [ "$HTTP_CODE" != "200" ]; then
          DETAIL=$(echo "$RESPONSE" | jq -r '.detail // empty' 2>/dev/null || true)
          echo "::error::Paradigm API returned HTTP ${HTTP_CODE}: ${DETAIL:-$RESPONSE}"
          exit 1
        fi

        # Parse response
        VERDICT=$(echo "$RESPONSE" | jq -r '.verdict')
        MARKDOWN=$(echo "$RESPONSE" | jq -r '.markdown')
        AFFECTED=$(echo "$RESPONSE" | jq -r '.affected')
        CHANGED=$(echo "$RESPONSE" | jq -r '.changed')

        # Set outputs
        echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
        echo "affected=${AFFECTED}" >> "$GITHUB_OUTPUT"

        # Post sticky PR comment
        COMMENT_MARKER="<!-- paradigm-blast-radius -->"
        COMMENT_BODY="${COMMENT_MARKER}
        ${MARKDOWN}"

        EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq ".[] | select(.body | contains(\"${COMMENT_MARKER}\")) | .id" \
          2>/dev/null | head -1)

        if [ -n "$EXISTING" ]; then
          gh api "repos/${REPO}/issues/comments/${EXISTING}" \
            -X PATCH -f body="${COMMENT_BODY}" > /dev/null
          echo "Updated blast radius comment"
        else
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="${COMMENT_BODY}" > /dev/null
          echo "Posted blast radius comment"
        fi

        # Summary
        echo "## Blast Radius: ${VERDICT}" >> "$GITHUB_STEP_SUMMARY"
        echo "Changed: ${CHANGED}, Affected: ${AFFECTED}" >> "$GITHUB_STEP_SUMMARY"

        # Fail if critical
        if [ "$VERDICT" = "FAIL" ]; then
          echo "::error::Blast radius analysis found critical issues"
          exit 1
        fi
