name: 'Paradigm Blast Radius'
description: 'AI-powered blast radius analysis for pull requests using Paradigm code intelligence'
branding:
  icon: 'target'
  color: 'orange'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key for Claude'
    required: true
  paradigm-api-url:
    description: 'Paradigm MCP server URL'
    required: false
    default: 'https://api.useparadigm.app/mcp'
  project:
    description: 'Paradigm project name'
    required: true
  model:
    description: 'Claude model to use'
    required: false
    default: 'claude-sonnet-4-6'
  max-turns:
    description: 'Max agent turns'
    required: false
    default: '10'

runs:
  using: 'composite'
  steps:
    - name: Create MCP config
      shell: bash
      run: |
        cat > /tmp/paradigm-mcp.json << EOF
        {
          "mcpServers": {
            "paradigm": {
              "type": "http",
              "url": "${{ inputs.paradigm-api-url }}"
            }
          }
        }
        EOF

    - name: Analyze blast radius
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        use_sticky_comment: true
        claude_args: |
          --mcp-config /tmp/paradigm-mcp.json
          --allowedTools mcp__paradigm__analyze_pr,mcp__paradigm__get_method_body,mcp__paradigm__project_status,Read
          --max-turns ${{ inputs.max-turns }}
          --model ${{ inputs.model }}
        prompt: |
          You are a blast radius analyzer for pull requests. Your job is to identify what could break or needs attention when this PR is merged.

          ## Steps

          1. Call `analyze_pr` with repo "${{ github.repository }}" and pr_number ${{ github.event.pull_request.number }} to get the blast radius graph — which methods are changed, deleted, and what calls them.

          2. For each MUST FIX or MUST CHECK item, use `get_method_body` to read the actual code of the affected method. Understand WHY it's affected — don't just say "this calls the changed method", explain what specifically could break.

          3. Write a concise blast radius report:

          ### Format

          **If no issues found:**
          > Blast radius analysis: **PASS** — changes are self-contained, no cross-module impact detected.

          **If issues found:**
          > ## Blast Radius: [VERDICT]
          >
          > **Summary**: [1-2 sentences on what changed and overall risk]
          >
          > ### Must address
          > - **`MethodName`** in `file.py:line` — [concrete explanation of what breaks and why, based on reading the code]
          >
          > ### Worth checking
          > - **`MethodName`** in `file.py:line` — [why this might be affected, what to verify]

          ## Rules
          - Be concise. No method body dumps in the report.
          - Verify before reporting — read the caller's code to confirm the dependency actually matters.
          - If a "deleted" method still exists in the PR branch, it's not actually deleted (could be a diff artifact). Verify.
          - Group related items (e.g. "3 admin endpoints all call `_gateway_get` which was changed").
          - Project name for MCP calls: "${{ inputs.project }}"
